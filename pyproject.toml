[project]
name = "prep-canals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "ipykernel<7", # higher versions seem to stall the VSCode Interactive Terminal
    "ruff>=0.16.1",
    "tabulate>=0.10.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
