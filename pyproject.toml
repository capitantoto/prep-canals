[project]
name = "prep-canals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.52.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "ipykernel<7", # higher versions seem to stall the VSCode Interactive Terminal
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "scipy-stubs>=1.17.1.5",
    "tabulate>=0.10.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
